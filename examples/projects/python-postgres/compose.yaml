services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: example
      POSTGRES_USER: example
      POSTGRES_PASSWORD: local-example-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - example-data:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  example-data: {}
